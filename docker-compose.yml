networks:
  linkforge_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: linkforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkforge}
      POSTGRES_USER: ${POSTGRES_USER:-linkforge_user}
      # This fallback is for local development only. Override it in .env for
      # any shared or non-local environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkforge_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - linkforge_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkforge_user} -d ${POSTGRES_DB:-linkforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkforge_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - linkforge_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: linkforge_api
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    ports:
      - "8000:8000"
    networks:
      - linkforge_net
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: linkforge_adminer
    ports:
      - "8080:8080"
    networks:
      - linkforge_net
    depends_on:
      - postgres
