[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "linkforge"
version = "1.0.0"
description = "A smart URL shortener built with FastAPI"
requires-python = ">=3.12"
authors = [{ name = "Priyanshu" }]

[project.urls]
Repository = "https://github.com/yourusername/linkforge"

[project.dependencies]
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
sqlalchemy = { version = ">=2.0.31", extras = ["asyncio"] }
asyncpg = ">=0.29.0"
psycopg2-binary = ">=2.9.0"
alembic = ">=1.13.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.3.0"
bcrypt = ">=4.0.0"
python-jose = { version = ">=3.3.0", extras = ["cryptography"] }
httpx = ">=0.27.0"
structlog = ">=24.2.0"
redis = { version = ">=5.0.0", extras = ["hiredis"] }
python-multipart = ">=0.0.9"
qrcode = { version = ">=7.4.2", extras = ["pil"] }
Pillow = ">=10.3.0"
