# .github/workflows/deploy.yml
# Triggers a Render deploy on every push to main.
#
# Setup (one-time):
#   1. Go to your Render service -> Settings -> Deploy Hook -> copy the URL.
#   2. In GitHub repo -> Settings -> Secrets -> Actions, add:
#        RENDER_DEPLOY_HOOK_URL  =  <paste the full Render deploy hook URL>
#   That is ALL. Render handles the rest (build, migrate, restart).

name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render responded with HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "Deploy hook call failed (status $HTTP_STATUS)"
            exit 1
          fi
          echo "Deploy triggered successfully!"
