# render.yaml — LinkForge Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# This file provisions ALL services in one click via Render's "Deploy from Blueprint" button.
# Required secrets (set in Render Dashboard -> Environment Groups or per-service):
#   SECRET_KEY, POSTGRES_PASSWORD, GEMINI_API_KEY (optional), GOOGLE_CLIENT_ID (optional)

services:
  # ---------------------------------------------
  # Web Service — FastAPI backend (serves frontend too)
  # ---------------------------------------------
  - type: web
    name: linkforge-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                      # upgrade to starter/standard in production
    healthCheckPath: /api/v1/health/live
    autoDeploy: true                # re-deploy on every push to the deploy branch

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO

      # Database — uses the managed Postgres provisioned below
      - key: DATABASE_URL
        fromDatabase:
          name: linkforge-db
          property: connectionString

      # Redis — uses the managed Redis provisioned below
      - key: REDIS_HOST
        fromService:
          name: linkforge-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: linkforge-redis
          type: redis
          property: port

      # Secrets — set these in the Render dashboard (never commit real values)
      - key: SECRET_KEY
        sync: false                 # Render will prompt for this value
      - key: POSTGRES_PASSWORD
        sync: false

      # Base URL — Render injects RENDER_EXTERNAL_URL automatically;
      # the app reads it dynamically in config.py so this is just a fallback.
      - key: BASE_URL
        value: https://linkforge-api.onrender.com

      # Optional integrations
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://linkforge-api.onrender.com/api/v1/auth/google/callback

      - key: CORS_ORIGINS
        value: '["https://linkforge-api.onrender.com"]'

  # ---------------------------------------------
  # Managed PostgreSQL 16
  # ---------------------------------------------
  - type: pserv
    name: linkforge-db
    plan: free
    databaseName: linkforge
    databaseUser: linkforge_user

  # ---------------------------------------------
  # Managed Redis 7
  # ---------------------------------------------
  - type: redis
    name: linkforge-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
